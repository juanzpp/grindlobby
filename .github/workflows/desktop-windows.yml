name: Desktop Windows

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'components/feedback/GrindPortalLoading.tsx'
      - 'app/grind-loading-portal.css'
      - 'public/brand/grindlobby-official.png'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'components/feedback/GrindPortalLoading.tsx'
      - 'app/grind-loading-portal.css'
      - 'public/brand/grindlobby-official.png'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Rust dependency lock
        run: cargo generate-lockfile

      - name: Verify Rust dependency lock
        shell: pwsh
        run: |
          $expected = '97c9eab69cda90cacf01f53c08b049fa306405503da35805492e97c7376d3934'
          $actual = (Get-FileHash 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Cargo.lock dependency graph changed. Expected $expected but resolved $actual. Review dependency updates before shipping."
          }
          Write-Host "Cargo.lock verified: $actual"

      - name: Upload Cargo lock
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Cargo-Lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Prepare square desktop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = (Resolve-Path '../../public/brand/grindlobby-official.png').Path
          $img = [System.Drawing.Image]::FromFile($src)
          $size = [Math]::Max($img.Width, $img.Height)
          $bmp = New-Object System.Drawing.Bitmap $size, $size
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $x = [int](($size - $img.Width) / 2)
          $y = [int](($size - $img.Height) / 2)
          $graphics.DrawImage($img, $x, $y, $img.Width, $img.Height)
          $bmp.Save((Join-Path $PWD 'app-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bmp.Dispose()
          $img.Dispose()

      - name: Generate Windows icons from GrindLobby logo
        run: npx --yes @tauri-apps/cli@2.11.4 icon app-icon.png

      - name: Cargo check standard
        run: cargo check --locked

      - name: Cargo check performance
        run: cargo check --locked --features lite

      - name: Build standard Windows installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis -- --locked

      - name: Upload standard EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Clean standard bundle output
        shell: pwsh
        run: |
          if (Test-Path 'target/release/bundle/nsis') { Remove-Item 'target/release/bundle/nsis' -Recurse -Force }

      - name: Build Performance Windows installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --features lite --config tauri.lite.conf.json -- --locked

      - name: Upload Performance EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Performance-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
