name: Desktop V3 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/rebuild-v3-fidelity
    paths:
      - "desktop/**"
      - "public/grindlobby-logo.png"
      - ".github/workflows/desktop-v2-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Validate TypeScript and web bundle
        working-directory: desktop
        run: bun run build

      - name: Capture real desktop UI previews
        working-directory: desktop
        shell: pwsh
        continue-on-error: true
        run: |
          bunx playwright install chromium
          $bun = (Get-Command bun).Source
          $preview = Start-Process -FilePath $bun -ArgumentList "run","preview" -PassThru
          Start-Sleep -Seconds 3
          bun run capture:previews
          Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Desktop-V3-Previews
          path: desktop/preview-captures/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Generate GrindLobby native icons
        working-directory: desktop
        run: bunx tauri icon ../public/grindlobby-logo.png

      - name: Build NSIS installer
        working-directory: desktop
        run: bun run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Desktop-V3-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
