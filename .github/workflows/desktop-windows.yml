name: Desktop Windows

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'components/desktop/**'
      - 'components/DesktopRuntimeMode.tsx'
      - 'components/AudioHost.tsx'
      - 'components/RemoteVoiceAudio.tsx'
      - 'components/PersistentCallDock.tsx'
      - 'components/stream/**'
      - 'lib/webrtc/**'
      - 'components/feedback/GrindPortalLoading.tsx'
      - 'app/page.tsx'
      - 'app/lobby/**'
      - 'app/community/**'
      - 'app/competitive/**'
      - 'app/profile/**'
      - 'app/settings/**'
      - 'app/loja/**'
      - 'app/native-desktop.css'
      - 'app/native-home.css'
      - 'app/native-modules.css'
      - 'app/grind-loading-portal.css'
      - 'app/layout.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'public/brand/grindlobby-official.png'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'components/desktop/**'
      - 'components/DesktopRuntimeMode.tsx'
      - 'components/AudioHost.tsx'
      - 'components/RemoteVoiceAudio.tsx'
      - 'components/PersistentCallDock.tsx'
      - 'components/stream/**'
      - 'lib/webrtc/**'
      - 'components/feedback/GrindPortalLoading.tsx'
      - 'app/page.tsx'
      - 'app/lobby/**'
      - 'app/community/**'
      - 'app/competitive/**'
      - 'app/profile/**'
      - 'app/settings/**'
      - 'app/loja/**'
      - 'app/native-desktop.css'
      - 'app/native-home.css'
      - 'app/native-modules.css'
      - 'app/grind-loading-portal.css'
      - 'app/layout.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'public/brand/grindlobby-official.png'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci

      - name: Build bundled desktop frontend
        working-directory: .
        run: npx --yes vite@7.1.3 build desktop/ui --config desktop/ui/vite.config.mjs --base ./ --outDir ../dist --emptyOutDir

      - name: Copy GrindLobby brand asset
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'desktop/dist/brand' | Out-Null
          Copy-Item 'public/brand/grindlobby-official.png' 'desktop/dist/brand/grindlobby-official.png' -Force

      - name: Validate local desktop bundle contract
        working-directory: .
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/dist/index.html')) { throw 'desktop/dist/index.html missing' }
          if (-not (Test-Path 'desktop/dist/assets')) { throw 'desktop/dist/assets missing' }
          $main = Get-Content 'desktop/src-tauri/src/main.rs' -Raw
          if ($main -match 'WebviewUrl::External') { throw 'Desktop still depends on external web frontend' }
          if ($main -notmatch 'WebviewUrl::App') { throw 'Desktop local frontend entrypoint missing' }
          if ($main -notmatch 'decorations\(false\)') { throw 'Custom titlebar contract missing' }
          $source = Get-Content 'desktop/ui/src/main.jsx' -Raw -Encoding utf8
          foreach ($needle in @('function CommunityView','function TournamentsView','function MessagesView','CreateLobbyModal','setScreenShareEnabled','voice/token')) {
            if ($source -notmatch [regex]::Escape($needle)) { throw "Desktop source missing contract: $needle" }
          }

      - name: Resolve Rust dependency lock
        run: cargo generate-lockfile

      - name: Verify Rust dependency lock
        shell: pwsh
        run: |
          $expected = '657a17b2c9f33d14014602f61ae1cd91c543c02c69c30bdf14b87fdee1e7c58e'
          $actual = (Get-FileHash 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Cargo.lock dependency graph changed. Expected $expected but resolved $actual. Review dependency updates before shipping."
          }
          Write-Host "Cargo.lock verified: $actual"

      - name: Upload Cargo lock
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Cargo-Lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Prepare square desktop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = (Resolve-Path '../../public/brand/grindlobby-official.png').Path
          $img = [System.Drawing.Image]::FromFile($src)
          $size = [Math]::Max($img.Width, $img.Height)
          $bmp = New-Object System.Drawing.Bitmap $size, $size
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $x = [int](($size - $img.Width) / 2)
          $y = [int](($size - $img.Height) / 2)
          $graphics.DrawImage($img, $x, $y, $img.Width, $img.Height)
          $bmp.Save((Join-Path $PWD 'app-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bmp.Dispose()
          $img.Dispose()

      - name: Generate Windows icons from GrindLobby logo
        run: npx --yes @tauri-apps/cli@2.11.4 icon app-icon.png

      - name: Cargo check
        run: cargo check --locked

      - name: Build GrindLobby Windows installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis -- --locked

      - name: Upload GrindLobby EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

# GrindLobby ships as one Windows app. Release optimization is handled by Cargo's release profile.
