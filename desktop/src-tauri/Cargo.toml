[package]
name = "grindlobby-desktop"
version = "0.1.0"
description = "GrindLobby desktop client"
authors = ["GrindLobby"]
edition = "2021"

[features]
default = []
lite = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
