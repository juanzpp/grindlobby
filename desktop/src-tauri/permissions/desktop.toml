"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-api-request"
description = "Allows the local GrindLobby desktop UI to call the fixed GrindLobby backend API through the native cookie-aware bridge."
commands.allow = ["api_request"]

[[permission]]
identifier = "allow-window-controls"
description = "Allows the local GrindLobby desktop titlebar to control its own main window."
commands.allow = ["window_minimize", "window_toggle_maximize", "window_close"]
