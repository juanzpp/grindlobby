[package]
name = "grindlobby-desktop"
version = "0.1.0"
description = "GrindLobby desktop client"
authors = ["GrindLobby"]
edition = "2021"

[features]
default = []
lite = []

# Pin direct desktop dependencies; Cargo.lock pins the full transitive graph.
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
url = "=2.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
