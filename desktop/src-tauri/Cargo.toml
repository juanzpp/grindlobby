[package]
name = "grindlobby-desktop"
version = "0.1.0"
description = "GrindLobby native desktop client"
authors = ["GrindLobby"]
edition = "2021"

[lib]
name = "grindlobby_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
