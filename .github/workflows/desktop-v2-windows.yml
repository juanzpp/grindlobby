name: Desktop V2 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/rebuild-v2
    paths:
      - "desktop/**"
      - "public/grindlobby-logo.png"
      - ".github/workflows/desktop-v2-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Generate GrindLobby native icons
        working-directory: desktop
        run: bunx tauri icon ../public/grindlobby-logo.png

      - name: Build NSIS installer
        working-directory: desktop
        run: bun run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GrindLobby-Desktop-V2-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
