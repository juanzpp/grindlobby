[package]
name = "grindlobby-desktop"
version = "0.3.0"
description = "GrindLobby native Windows desktop client"
authors = ["GrindLobby"]
edition = "2021"

[lib]
name = "grindlobby_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
livekit = { git = "https://github.com/livekit/rust-sdks", rev = "70ca65fcd66660cc8f505af684409b10c151425d", features = ["rustls-tls-native-roots"] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
