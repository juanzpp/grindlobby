name: Validate Pixel Perfect Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-pixel-perfect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
