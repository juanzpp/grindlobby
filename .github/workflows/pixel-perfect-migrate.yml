name: Pixel Perfect Root Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixel-perfect-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-perfect-root-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current GrindLobby
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Pixel Perfect archive
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='639835afd8dcb9bc45563b3133ca4faece98831bb2b81e84bbe3d421236ed991'
          PROD='https://pixel-perfect-clone-87933.lovable.app/pixel-perfect-export.tar.gz'
          PREVIEW='https://id-preview--6df5c80b-d9f1-417c-bda4-2a268217f2ca.lovable.app/pixel-perfect-export.tar.gz'
          ok=0
          for attempt in $(seq 1 30); do
            for url in "$PROD" "$PREVIEW"; do
              rm -f /tmp/pixel-perfect.tar.gz
              if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 "$url" -o /tmp/pixel-perfect.tar.gz; then
                actual="$(sha256sum /tmp/pixel-perfect.tar.gz | awk '{print $1}')"
                if [ "$actual" = "$EXPECTED" ]; then
                  ok=1
                  break 2
                fi
              fi
            done
            sleep 10
          done
          if [ "$ok" != '1' ]; then
            echo 'Pixel Perfect archive could not be downloaded with the expected SHA256.' >&2
            exit 1
          fi
          tar -tzf /tmp/pixel-perfect.tar.gz >/dev/null
          echo "Verified archive: $EXPECTED"

      - name: Replace repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pixel-perfect-extracted
          tar -xzf /tmp/pixel-perfect.tar.gz -C /tmp/pixel-perfect-extracted
          test -f /tmp/pixel-perfect-extracted/package.json
          test -d /tmp/pixel-perfect-extracted/src

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          if [ -d .github ]; then
            find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
            if [ -d .github/workflows ]; then
              find .github/workflows -mindepth 1 -maxdepth 1 ! -name 'pixel-perfect-migrate.yml' -exec rm -rf {} +
            fi
          fi

          cp -a /tmp/pixel-perfect-extracted/. .
          rm -rf .export-base64 .migration-export

          test -f package.json
          test -f src/routes/index.tsx
          test -f src/routes/loja.tsx
          test -f src/routes/login.tsx
          test -f src/routes/perfil.tsx
          test -f src/routes/loading.tsx

      - name: Commit exact root replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GrindLobby Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes detected.'
            exit 0
          fi
          git commit -m 'chore: replace GrindLobby root with Pixel Perfect Replica [skip ci]'
          git push origin HEAD:main
